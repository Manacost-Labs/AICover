<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="32" height="16" rx="8" fill="url(#shine)"/>

  <!-- Central sparkle star -->
  <path d="M16 6 L17.2 13.2 L24 12 L17.2 14.8 L20 21.5 L15.5 15.8 L10 22 L13.5 15 L6.5 14 L13.8 12.5 Z"
        fill="white" opacity="0.95"/>

  <!-- Small top-right sparkle -->
  <path d="M23 8 L23.5 10.5 L26 11 L23.5 11.5 L23 14 L22.5 11.5 L20 11 L22.5 10.5 Z"
        fill="white" opacity="0.7"/>

  <!-- Small bottom-left sparkle -->
  <path d="M9 19 L9.4 21 L11.5 21.5 L9.4 22 L9 24 L8.6 22 L6.5 21.5 L8.6 21 Z"
        fill="white" opacity="0.55"/>
</svg>
